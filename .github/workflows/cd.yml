name: CD

on:
  push:
    branches:
      - main

jobs:
  # Check if services changed
  changes:
    name: Check service changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
            api:
              - 'services/api/**'
            ai:
              - 'services/ai/**'

  # Build & Deploy job matrix
  build-and-deploy:
    name: Build & Deploy Services
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, api, ai]
    steps:
      # Jalankan langkah ini hanya jika service memiliki perubahan
      - name: Checkout repository
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker paths
        id: paths
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then
            echo "context=apps/web" >> $GITHUB_OUTPUT
            echo "image=anomalyco/kriya-web" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" = "api" ]; then
            echo "context=services/api" >> $GITHUB_OUTPUT
            echo "image=anomalyco/kriya-api" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.service }}" = "ai" ]; then
            echo "context=services/ai" >> $GITHUB_OUTPUT
            echo "image=anomalyco/kriya-ai" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image locally (for scan)
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.paths.outputs.context }}
          load: true
          tags: ${{ steps.paths.outputs.image }}:local

      - name: Run Trivy vulnerability scanner on Image
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.paths.outputs.image }}:local
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Push image to GHCR
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.paths.outputs.context }}
          push: true
          tags: |
            ghcr.io/${{ steps.paths.outputs.image }}:${{ github.sha }}
            ghcr.io/${{ steps.paths.outputs.image }}:latest

      - name: Install kubectl & Helm
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Deploy to K3s via Helm
        if: |
          (matrix.service == 'web' && needs.changes.outputs.web == 'true') ||
          (matrix.service == 'api' && needs.changes.outputs.api == 'true') ||
          (matrix.service == 'ai' && needs.changes.outputs.ai == 'true')
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          helm upgrade --install kriya ./helm/kriya \
            --namespace default \
            --set global.imageRegistry=ghcr.io \
            --set ${{ matrix.service }}.image.tag=${{ github.sha }} \
            --set api.secrets.SUPABASE_DB_URL="${{ secrets.SUPABASE_DB_URL }}" \
            --set api.secrets.SUPABASE_JWT_SECRET="${{ secrets.SUPABASE_JWT_SECRET }}" \
            --set api.secrets.MIDTRANS_SERVER_KEY="${{ secrets.MIDTRANS_SERVER_KEY }}" \
            --set api.secrets.MIDTRANS_CLIENT_KEY="${{ secrets.MIDTRANS_CLIENT_KEY }}" \
            --set api.secrets.INTERNAL_API_KEY="${{ secrets.INTERNAL_API_KEY }}" \
            --set ai.secrets.SUPABASE_DB_URL="${{ secrets.SUPABASE_DB_URL }}" \
            --set ai.secrets.GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --set ai.secrets.INTERNAL_API_KEY="${{ secrets.INTERNAL_API_KEY }}" \
            --reuse-values
