# Dynamic secrets definition for deployment template
{{- range $serviceName := list "api" }}
{{- $serviceValues := index $.Values $serviceName }}
{{- if $serviceValues.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $serviceName }}-secrets
type: Opaque
data:
  {{- range $key, $value := $serviceValues.secrets }}
  {{ $key }}: {{ if $value }}{{ $value | b64enc | quote }}{{ else }}{{ "dummy" | b64enc | quote }}{{ end }}
  {{- end }}
---
{{- end }}
{{- end }}
