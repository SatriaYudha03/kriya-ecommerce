global:
  domain: kriya.my.id
  imageRegistry: ghcr.io
  imagePullSecrets:
    - name: ghcr-secret

web:
  replicaCount: 1
  image:
    repository: anomalyco/kriya-web
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
    NEXT_PUBLIC_API_URL: "https://api.kriya.my.id"
    NEXT_PUBLIC_CHAT_WEBHOOK_URL: "https://n8n.kriya.my.id/webhook/chat"

api:
  replicaCount: 1
  image:
    repository: anomalyco/kriya-api
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    WEB_ORIGIN: "https://kriya.my.id"
  secrets:
    SUPABASE_DB_URL: ""
    SUPABASE_JWT_SECRET: ""
    MIDTRANS_SERVER_KEY: ""
    MIDTRANS_CLIENT_KEY: ""
    INTERNAL_API_KEY: ""

