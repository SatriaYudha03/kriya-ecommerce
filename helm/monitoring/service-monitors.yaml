apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kriya-services-monitor
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: api # Menangkap pod 'api'
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kriya-ai-monitor
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ai # Menangkap pod 'ai'
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
